services:
  vpp-node-1:
    # Load all variables from dev.env inside the container environment
    env_file:
      - dev.env
    image: ${VPPDEV_IMAGE}
    build:
      context: .   # Points to the directory where your Dockerfile lives
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        USER_NAME: ${USER_NAME}
    container_name: ${VPPDEV_CNR_1}
    privileged: true
    networks:
      vpp-net-1:       # Private LAN 1
        ipv4_address: ${VPPDEV_CNR_1_IP}
      vpp-transit:     # Shared Transit WAN
        ipv4_address: ${VPPDEV_CNR_1_TRANSIT_IP}
    # Log in as the user you created in the Dockerfile
    user: "${USER_ID}:${GROUP_ID}"
    volumes:
      - /dev:/dev
      - ${VPP_SRC_DIR}:/workspace/vpp
    working_dir: /workspace/vpp
    environment:
      - MAKE_PARALLEL_JOBS=2
    # Change command to an idling bash shell so the container stays alive
    command: /bin/bash
    stdin_open: true
    tty: true

  vpp-node-2:
    # Load all variables from dev.env inside the container environment
    env_file:
      - dev.env
    image: ${VPPDEV_IMAGE}
    container_name: ${VPPDEV_CNR_2}
    build:
      context: .   # Points to the directory where your Dockerfile lives
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        USER_NAME: ${USER_NAME}
    privileged: true
    networks:
      vpp-transit:     # Shared Transit WAN
        ipv4_address: ${VPPDEV_CNR_2_TRANSIT_IP}
    # Log in as the user you created in the Dockerfile
    user: "${USER_ID}:${GROUP_ID}"
    volumes:
      - /dev:/dev
      - ${VPP_SRC_DIR}:/workspace/vpp
    working_dir: /workspace/vpp
    environment:
      - MAKE_PARALLEL_JOBS=2
    # Change command to an idling bash shell so the container stays alive
    command: /bin/bash
    stdin_open: true
    tty: true

# Docker automatically provisions all three networks on 'docker compose up'
networks:
  vpp-net-1:
    driver: bridge
    ipam:
      config:
        - subnet: ${VPPDEV_NET_1_SUBNET}
  vpp-transit:
    driver: bridge
    ipam:
      config:
        - subnet: ${VPPDEV_TRANSIT_NET_SUBNET}